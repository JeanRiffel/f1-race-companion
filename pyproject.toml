[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1companion"
version = "0.1.0"
description = "Understand a Formula 1 race in under a minute: recap, strategy, head-to-head, and race pace analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastf1>=3.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "streamlit>=1.36",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["f1companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = ["network: hits the real FastF1 API; run with -m network"]
